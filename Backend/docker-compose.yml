# Full backend: gateway on :3000 plus one container per service.
#
#   docker compose up -d          everything
#   docker compose up -d mongodb redis   infrastructure only, run services with npm run dev
#
# Inside this network services address each other by container name (http://user-service:3002).
# On the host they are http://localhost:<port>. That is the whole difference between the compose
# environment blocks below and .env.example.

# NODE_ENV defaults to development here: this file is the local stack. The image itself defaults to
# production (see Dockerfile), and a real deployment sets NODE_ENV=production — at which point the
# boot guard refuses to start on the secrets published in .env.example, which is the point of it.
# It also refuses the Mongo root password and the Redis password this file falls back to: set
# MONGO_ROOT_PASSWORD and REDIS_PASSWORD in .env for anything that is not your own laptop.
# CORS_ORIGIN has no fallback here: a localhost default would pass the production check in
# config/env.ts, so compose refuses to start without it instead (audit #2).
#
# No container_name anywhere: Compose namespaces containers by project (backend-gateway-1, ...).
# Hardcoding bgsc-* collides with the Legacy stack, which used the same names — address containers
# by service instead: `docker compose logs -f gateway`, `docker compose exec user-service sh`.
services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    # Loopback only: the database is for the containers on this network and for a developer's own
    # tools, never the LAN (audit Sep 26 — it was published on every interface with a root password
    # committed in this file). MONGO_ROOT_PASSWORD only takes effect when the volume is first
    # created; changing it later means changing the user inside Mongo too. Keep it URL-safe: it is
    # pasted into every MONGO_URI below unencoded.
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: bgsc_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-bgsc_password}
      MONGO_INITDB_DATABASE: bgsc_dev
    volumes:
      - mongodb_data:/data/db
    # mongod opens a file per collection and per index, and the scratch databases the test suite
    # creates and drops churn through thousands of them. Docker's default soft limit of 1024-2048
    # is not enough: WiredTiger hits EMFILE ("Too many open files"), panics, and mongod ABORTS —
    # which reads as a random "MongoNetworkError: connection closed" in whichever selfcheck was
    # running, and leaves an unclean shutdown behind. 64000 is MongoDB's own documented minimum.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Loopback only, and password-protected: the bus carries events that move points, and anything
    # that could reach an open Redis could publish one (audit Sep 26). Messages are also HMAC-signed
    # with INTERNAL_API_TOKEN (packages/shared/src/events/publish.ts), so the password guards the
    # channel and the signature guards the payload. The production guard refuses the fallback below.
    # Services get the password as REDIS_PASSWORD, never inside REDIS_URL: pasted into a URL, a
    # password with `/ # ? %` crash-looped every service (audit #2). Any characters are fine now.
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_password_change_me}
    command: ["sh", "-c", "exec redis-server --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---- application ---------------------------------------------------------
  # Every service shares one image; only the entrypoint and port differ.

  gateway:
    build: { context: ., dockerfile: Dockerfile }
    image: bgsc-backend:local
    restart: unless-stopped
    command: ["node", "dist/index.js"]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GATEWAY_PORT: 3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      # Container-network addresses, not localhost.
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      EVENT_SERVICE_URL: http://event-service:3003
      REGISTRATION_SERVICE_URL: http://registration-service:3004
      ANNOUNCEMENT_SERVICE_URL: http://announcement-service:3005
      POINTS_SERVICE_URL: http://points-service:3006
      LEADERBOARD_SERVICE_URL: http://leaderboard-service:3007
      CHALLENGE_SERVICE_URL: http://challenge-service:3008
      MEDIA_SERVICE_URL: http://media-service:3009
      NOTIFICATION_SERVICE_URL: http://notification-service:3010
      FEEDBACK_SERVICE_URL: http://feedback-service:3011
      BRACKET_SERVICE_URL: http://bracket-service:3012
    depends_on:
      auth-service: { condition: service_healthy }
      user-service: { condition: service_healthy }
      registration-service: { condition: service_healthy }
      event-service: { condition: service_healthy }
      announcement-service: { condition: service_healthy }
      points-service: { condition: service_healthy }
      leaderboard-service: { condition: service_healthy }
      challenge-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
      feedback-service: { condition: service_healthy }
      bracket-service: { condition: service_healthy }
      media-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  auth-service:
    build: { context: ., dockerfile: Dockerfile }
    image: bgsc-backend:local
    restart: unless-stopped
    command: ["node", "apps/auth-service/dist/index.js"]
    # No host port: reachable only through the gateway and the internal network.
    expose:
      - "3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      MONGO_URI: mongodb://bgsc_admin:${MONGO_ROOT_PASSWORD:-bgsc_password}@mongodb:27017/bgsc_dev?authSource=admin
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_password_change_me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      # config/env.ts refuses to boot in production without it, gateway or not.
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      USER_SERVICE_URL: http://user-service:3002
      # OAuth and the links in auth mail point at the public edge and the web app, not at this
      # container. Blank = config/env.ts derives them from API_BASE_URL / its localhost defaults, and
      # Google sign-in answers "not configured" (audit #2: none of these reached the container).
      API_BASE_URL: ${API_BASE_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  user-service:
    build: { context: ., dockerfile: Dockerfile }
    image: bgsc-backend:local
    restart: unless-stopped
    command: ["node", "apps/user-service/dist/index.js"]
    expose:
      - "3002"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      MONGO_URI: mongodb://bgsc_admin:${MONGO_ROOT_PASSWORD:-bgsc_password}@mongodb:27017/bgsc_dev?authSource=admin
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_password_change_me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      # config/env.ts refuses to boot in production without it, gateway or not.
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      AUTH_SERVICE_URL: http://auth-service:3001
      # Avatars land under avatars/ in the shared upload root; media-service serves them.
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  registration-service:
    build: { context: ., dockerfile: Dockerfile }
    image: bgsc-backend:local
    restart: unless-stopped
    command: ["node", "apps/registration-service/dist/index.js"]
    expose:
      - "3004"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3004
      MONGO_URI: mongodb://bgsc_admin:${MONGO_ROOT_PASSWORD:-bgsc_password}@mongodb:27017/bgsc_dev?authSource=admin
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_password_change_me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      # config/env.ts refuses to boot in production without it, gateway or not.
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      # Seat reservation is the one call this service makes out; unreachable means a submission
      # stays 'submitted' rather than falsely claiming a seat.
      EVENT_SERVICE_URL: http://event-service:3003
      # Form file answers land under registrations/ in the shared upload root.
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  event-service:
    build: { context: ., dockerfile: Dockerfile }
    image: bgsc-backend:local
    restart: unless-stopped
    command: ["node", "apps/event-service/dist/index.js"]
    expose:
      - "3003"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3003
      MONGO_URI: mongodb://bgsc_admin:${MONGO_ROOT_PASSWORD:-bgsc_password}@mongodb:27017/bgsc_dev?authSource=admin
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_password_change_me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      # Was missing: config/env.ts throws without it in production, so event-service crash-looped
      # and, through the gateway's depends_on, took the whole stack down with it (audit Sep 26).
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      # Attendance, promotion and auction purses are registration-service writes it asks for.
      REGISTRATION_SERVICE_URL: http://registration-service:3004
      # Posters and logos land under events/ in the shared upload root.
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      registration-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  announcement-service:
    build: { context: ., dockerfile: Dockerfile }
    image: bgsc-backend:local
    restart: unless-stopped
    command: ["node", "apps/announcement-service/dist/index.js"]
    expose:
      - "3005"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3005
      MONGO_URI: mongodb://bgsc_admin:${MONGO_ROOT_PASSWORD:-bgsc_password}@mongodb:27017/bgsc_dev?authSource=admin
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_password_change_me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  points-service:
    build: { context: ., dockerfile: Dockerfile }
    image: bgsc-backend:local
    restart: unless-stopped
    command: ["node", "apps/points-service/dist/index.js"]
    expose:
      - "3006"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3006
      MONGO_URI: mongodb://bgsc_admin:${MONGO_ROOT_PASSWORD:-bgsc_password}@mongodb:27017/bgsc_dev?authSource=admin
      # Without this every consumer in this service is deaf: ParticipantAttended is published by
      # another container, so a Points Service with no Redis awards nothing and looks healthy.
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_password_change_me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      # No *_SERVICE_URL: this service makes no outbound calls. Leaderboard calls us.
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  leaderboard-service:
    build: { context: ., dockerfile: Dockerfile }
    image: bgsc-backend:local
    restart: unless-stopped
    command: ["node", "apps/leaderboard-service/dist/index.js"]
    expose:
      - "3007"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3007
      MONGO_URI: mongodb://bgsc_admin:${MONGO_ROOT_PASSWORD:-bgsc_password}@mongodb:27017/bgsc_dev?authSource=admin
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_password_change_me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      POINTS_SERVICE_URL: http://points-service:3006
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      points-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3007/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  challenge-service:
    build: { context: ., dockerfile: Dockerfile }
    image: bgsc-backend:local
    restart: unless-stopped
    command: ["node", "apps/challenge-service/dist/index.js"]
    expose:
      - "3008"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3008
      MONGO_URI: mongodb://bgsc_admin:${MONGO_ROOT_PASSWORD:-bgsc_password}@mongodb:27017/bgsc_dev?authSource=admin
      # Without this, ChallengeCompleted never leaves this process and the Points Service — which
      # has consumed it since Sep 19 — pays nobody, while both containers look healthy.
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_password_change_me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      # The team lock on acceptance — the only service this one calls.
      REGISTRATION_SERVICE_URL: http://registration-service:3004
      # Strava. `:-` and not `:?`: the three platform secrets are required to boot, but an
      # unregistered Strava app is a 503 on six routes, not a reason the stack cannot start.
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_CALLBACK_URL: ${STRAVA_CALLBACK_URL:-http://localhost:3000/strava/callback}
      STRAVA_TOKEN_ENCRYPTION_KEY: ${STRAVA_TOKEN_ENCRYPTION_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      registration-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3008/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  notification-service:
    build: { context: ., dockerfile: Dockerfile }
    image: bgsc-backend:local
    restart: unless-stopped
    command: ["node", "apps/notification-service/dist/index.js"]
    # No host port: reachable only through the gateway and the internal network.
    expose:
      - "3010"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3010
      MONGO_URI: mongodb://bgsc_admin:${MONGO_ROOT_PASSWORD:-bgsc_password}@mongodb:27017/bgsc_dev?authSource=admin
      # Without this the broadcast hears nothing: AnnouncementPublished is published by another
      # process, and publish() stays in-process when REDIS_URL is unset.
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_password_change_me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      # The delivery writeback — the only service this one calls.
      ANNOUNCEMENT_SERVICE_URL: http://announcement-service:3005
      # WhatsApp. `:-` and not `:?`: the three platform secrets are required to boot, but an
      # unregistered WhatsApp Business account means every dispatch resolves 'skipped', not a
      # reason the stack cannot start.
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      WHATSAPP_API_BASE: ${WHATSAPP_API_BASE:-https://graph.facebook.com}
      WHATSAPP_GROUP_MAP: ${WHATSAPP_GROUP_MAP:-}
      WHATSAPP_RATE_LIMIT_PER_HOUR: ${WHATSAPP_RATE_LIMIT_PER_HOUR:-1}
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      announcement-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  feedback-service:
    build: { context: ., dockerfile: Dockerfile }
    image: bgsc-backend:local
    restart: unless-stopped
    command: ["node", "apps/feedback-service/dist/index.js"]
    # No host port: reachable only through the gateway and the internal network.
    expose:
      - "3011"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3011
      MONGO_URI: mongodb://bgsc_admin:${MONGO_ROOT_PASSWORD:-bgsc_password}@mongodb:27017/bgsc_dev?authSource=admin
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_password_change_me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3011/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
