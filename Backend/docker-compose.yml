    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3012
      MONGO_URI: mongodb://bgsc_admin:${MONGO_ROOT_PASSWORD:-bgsc_password}@mongodb:27017/bgsc_dev?authSource=admin
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_password_change_me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3012/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  media-service:
    build: { context: ., dockerfile: Dockerfile }
    image: bgsc-backend:local
    restart: unless-stopped
    command: ["node", "apps/media-service/dist/index.js"]
    expose:
      - "3009"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3009
      MONGO_URI: mongodb://bgsc_admin:${MONGO_ROOT_PASSWORD:-bgsc_password}@mongodb:27017/bgsc_dev?authSource=admin
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_password_change_me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      # The one server of /uploads: it reads what user, event and registration write here too.
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3009/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Loopback only and no basic auth: a developer's own browser, never the LAN.
  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: bgsc_admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-bgsc_password}
      ME_CONFIG_MONGODB_URL: mongodb://bgsc_admin:${MONGO_ROOT_PASSWORD:-bgsc_password}@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb: { condition: service_healthy }

volumes:
  mongodb_data:
    driver: local
  # One upload root for the platform (config.uploadDir). user, event and registration write under
  # their own prefixes; media-service is the only thing that serves /uploads, so it must see every
  # file the others write — which a volume per service could never give it.
  uploads:
    driver: local
