services:
  mongodb:
    image: mongo:7.0
    container_name: bgsc-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: bgsc_admin
      MONGO_INITDB_ROOT_PASSWORD: bgsc_password
      MONGO_INITDB_DATABASE: bgsc_dev
    volumes:
      - mongodb_data:/data/db

  mongo-express:
    image: mongo-express:1.0.2
    container_name: bgsc-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: bgsc_admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: bgsc_password
      ME_CONFIG_MONGODB_URL: mongodb://bgsc_admin:bgsc_password@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb

volumes:
  mongodb_data:
    driver: local
