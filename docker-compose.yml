services:
  postgres:
    image: postgres:16-alpine
    container_name: bgsc-postgres
    # C1+H3: No host port binding — reachable only within bgsc-network.
    # To access from host during dev, use: docker exec -it bgsc-postgres psql -U bgsc
    expose:
      - '5432'
    environment:
      POSTGRES_USER: bgsc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bgsc_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgsc -d bgsc_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bgsc-network

  redis:
    image: redis:7-alpine
    container_name: bgsc-redis
    # C1+H3: No host port binding + password required.
    expose:
      - '6379'
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bgsc-network

  # The root backend app (backend/src) IS the API Gateway — the public entry
  # point that routes to the auth/user microservices in backend/apps/*.
  api-gateway:
    build: ./backend
    container_name: bgsc-api-gateway
    ports:
      - '3000:3000'
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      sponsor-service:
        condition: service_started
      event-service:
        condition: service_started
      points-service:
        condition: service_started
      notification-service:
        condition: service_started
      announcement-service:
        condition: service_started
    environment:
      PORT: 3000
      NODE_ENV: development
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ISSUER: bgsc-auth-service
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      SPONSOR_SERVICE_URL: http://sponsor-service:3003
      EVENT_SERVICE_URL: http://event-service:3004
      POINTS_SERVICE_URL: http://points-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      ANNOUNCEMENT_SERVICE_URL: http://announcement-service:3007
      # social and challenge not yet in compose — gateway will 502 on those routes
      SOCIAL_SERVICE_URL: http://social-service:3008
      CHALLENGE_SERVICE_URL: http://challenge-service:3009
      CORS_ORIGINS: ${CORS_ORIGINS}
    networks:
      - bgsc-network

  user-service:
    build:
      context: ./backend
      dockerfile: apps/user-service/Dockerfile
    container_name: bgsc-user-service
    expose:
      - '3002'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3002
      NODE_ENV: development
      DATABASE_URL: postgresql://bgsc:${POSTGRES_PASSWORD}@postgres:5432/bgsc_dev
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ISSUER: bgsc-auth-service
      EVENT_SERVICE_URL: http://event-service:3004
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET}
      STRAVA_WEBHOOK_VERIFY_TOKEN: ${STRAVA_WEBHOOK_VERIFY_TOKEN}
      STRAVA_TOKEN_ENCRYPTION_KEY: ${STRAVA_TOKEN_ENCRYPTION_KEY}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    networks:
      - bgsc-network

  auth-service:
    build:
      context: ./backend
      dockerfile: apps/auth-service/Dockerfile
    container_name: bgsc-auth-service
    expose:
      - '3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: development
      DATABASE_URL: postgresql://bgsc:${POSTGRES_PASSWORD}@postgres:5432/bgsc_dev
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ISSUER: bgsc-auth-service
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      OAUTH_FRONTEND_CALLBACK_URL: ${OAUTH_FRONTEND_CALLBACK_URL}
      AUTH_TOTP_ENCRYPTION_KEY: ${AUTH_TOTP_ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      CORS_ORIGINS: ${CORS_ORIGINS}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET}
      STRAVA_CALLBACK_URL: ${STRAVA_CALLBACK_URL}
      USER_SERVICE_URL: http://user-service:3002
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    networks:
      - bgsc-network

  sponsor-service:
    build:
      context: ./backend
      dockerfile: apps/sponsor-service/Dockerfile
    container_name: bgsc-sponsor-service
    expose:
      - '3003'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3003
      NODE_ENV: development
      DATABASE_URL: postgresql://bgsc:${POSTGRES_PASSWORD}@postgres:5432/bgsc_dev
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ISSUER: bgsc-auth-service
    networks:
      - bgsc-network

  event-service:
    build:
      context: ./backend
      dockerfile: apps/event-service/Dockerfile
    container_name: bgsc-event-service
    expose:
      - '3004'
    depends_on:
      postgres:
        condition: service_healthy
      sponsor-service:
        condition: service_started
    environment:
      PORT: 3004
      NODE_ENV: development
      DATABASE_URL: postgresql://bgsc:${POSTGRES_PASSWORD}@postgres:5432/bgsc_dev
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ISSUER: bgsc-auth-service
      SPONSOR_SERVICE_URL: http://sponsor-service:3003
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    networks:
      - bgsc-network

  points-service:
    build:
      context: ./backend
      dockerfile: apps/points-service/Dockerfile
    container_name: bgsc-points-service
    expose:
      - '3005'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3005
      NODE_ENV: development
      DATABASE_URL: postgresql://bgsc:${POSTGRES_PASSWORD}@postgres:5432/bgsc_dev
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ISSUER: bgsc-auth-service
    networks:
      - bgsc-network

  notification-service:
    build:
      context: ./backend
      dockerfile: apps/notification-service/Dockerfile
    container_name: bgsc-notification-service
    expose:
      - '3006'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3006
      NODE_ENV: development
      DATABASE_URL: postgresql://bgsc:${POSTGRES_PASSWORD}@postgres:5432/bgsc_dev
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ISSUER: bgsc-auth-service
    networks:
      - bgsc-network

  announcement-service:
    build:
      context: ./backend
      dockerfile: apps/announcement-service/Dockerfile
    container_name: bgsc-announcement-service
    expose:
      - '3007'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3007
      NODE_ENV: development
      DATABASE_URL: postgresql://bgsc:${POSTGRES_PASSWORD}@postgres:5432/bgsc_dev
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ISSUER: bgsc-auth-service
    networks:
      - bgsc-network

volumes:
  pgdata:
  redisdata:

networks:
  bgsc-network:
    driver: bridge
